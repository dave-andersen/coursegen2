[package]
name = "coursegen2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Required for TOML deserialization of Config's chrono::NaiveDate fields.
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "*", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
atomic-write-file = "0.3"
